<div class="bg-[#f5f5f5]">
  <app-detail-breadcrumb [productName]="productName" />
  <div class="mx-auto px-5 md:px-8 py-8 md:py-10 space-y-8 md:space-y-10">
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-5 md:gap-6">
      <app-detail-product-gallery [productName]="productName" />
      <app-detail-product-info
        [productName]="productName"
        [activeVariantIndex]="activeVariantIndex()"
        [activeMemoryIndex]="activeMemoryIndex()"
        (variantSelected)="activeVariantIndex.set($event)"
        (memorySelected)="activeMemoryIndex.set($event)"
      />
      <app-detail-purchase-card [activeVariant]="activeVariant()" />
    </section>
    <app-detail-frequently-bought />
    <app-detail-product-tabs />
    <app-detail-related-products />
    <app-detail-recently-viewed />
  </div>
</div>
