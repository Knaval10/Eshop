<section class="bg-white rounded-2xl p-5 md:p-7">
  <div class="flex items-center justify-between mb-5">
    <h2 class="text-xl md:text-2xl font-bold uppercase tracking-wide text-[#111111]">
      Your Recently Viewed
    </h2>
    <a href="#" class="text-sm font-semibold text-[#16c60c] hover:underline">View All →</a>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
    @for (p of recentlyViewed; track p.id) {
      <app-detail-product-card [product]="p" [compact]="true" />
    }
  </div>
</section>
