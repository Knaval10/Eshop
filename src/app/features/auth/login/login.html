<section class="min-h-[70vh] bg-[#f5f5f5] py-10 px-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
    <h1 class="text-2xl font-bold text-[#1A1A1A]">Login</h1>
    <p class="text-sm text-gray-500 mt-1">Access your account to manage cart and checkout.</p>

    <form class="mt-6 space-y-4" (ngSubmit)="submit()">
      <label class="block">
        <span class="text-sm font-medium text-[#1A1A1A]">Email</span>
        <input type="email" required [ngModel]="form().email" (ngModelChange)="form.set({ ...form(), email: $event })"
          name="email"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:border-[#00B127]" />
      </label>

      <label class="block">
        <div class="flex justify-between items-center">
          <span class="text-sm font-medium text-[#1A1A1A]">Password</span>
          <a routerLink="/forgot-password" class="text-xs text-[#00B127] hover:underline font-semibold">Forgot Password?</a>
        </div>
        <input type="password" required [ngModel]="form().password"
          (ngModelChange)="form.set({ ...form(), password: $event })" name="password"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:border-[#00B127]" />
      </label>

      @if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
      }

      <button type="submit"
        class="w-full bg-[#00B127] hover:bg-[#009621] text-white font-semibold py-2.5 rounded-lg transition">
        Login
      </button>
    </form>

    <p class="text-sm text-gray-600 mt-5">
      New here?
      <a routerLink="/register" class="text-[#00B127] font-semibold hover:underline">Create account</a>
    </p>
  </div>
</section>
