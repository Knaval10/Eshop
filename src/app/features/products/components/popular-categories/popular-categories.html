<section>
  <h2 class="text-xl md:text-2xl font-bold text-[#111111] uppercase mb-5">Popular Categories</h2>
  <div class="bg-white rounded-2xl p-5 md:p-6">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-10 gap-4">
      @for (cat of categories; track cat.name) {
        <a href="#" class="group text-center">
          <div
            class="w-16 h-16 mx-auto rounded-full bg-[#f5f5f5] overflow-hidden mb-2 group-hover:ring-2 group-hover:ring-[#16c60c] transition"
          >
            <img [src]="cat.image" [alt]="cat.name" class="w-full h-full object-cover" />
          </div>
          <p
            class="text-xs font-semibold text-[#111111] group-hover:text-[#16c60c] transition leading-tight"
          >
            {{ cat.name }}
          </p>
          <p class="text-[10px] text-[#999999] mt-0.5">{{ cat.count }} items</p>
        </a>
      }
    </div>
  </div>
</section>
