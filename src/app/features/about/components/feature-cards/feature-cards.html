<section class="grid grid-cols-1 md:grid-cols-3 gap-5 md:gap-6">
  @for (feature of features; track feature.title) {
    <article class="bg-white rounded-xl p-7 md:p-8 hover:shadow-md transition">
      <div
        class="w-14 h-14 rounded-full bg-[#16c60c]/10 text-[#16c60c] flex items-center justify-center mb-5"
      >
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            [attr.d]="feature.icon"
          />
        </svg>
      </div>
      <h3 class="text-xl font-semibold text-[#111111] mb-3">{{ feature.title }}</h3>
      <p class="text-sm text-[#666666] leading-relaxed">{{ feature.description }}</p>
    </article>
  }
</section>
