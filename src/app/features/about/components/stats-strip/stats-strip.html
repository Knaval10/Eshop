<section class="bg-white rounded-2xl shadow-sm">
  <div
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 divide-y lg:divide-y-0 lg:divide-x divide-gray-100"
  >
    <div class="p-8 md:p-10">
      <p class="text-xs font-semibold text-[#999999] uppercase tracking-wider mb-2">Our Mission</p>
      <h3 class="text-2xl md:text-3xl font-bold leading-tight">
        <span class="text-[#16c60c]">ENRICH</span><br />
        <span class="text-[#16c60c]">AND ENHANCE</span>
      </h3>
    </div>
    @for (stat of stats; track stat.label) {
      <div class="p-8 md:p-10">
        <p class="text-4xl md:text-5xl font-bold text-[#111111] tracking-tight">
          {{ stat.value }}
        </p>
        <p class="text-sm text-[#666666] mt-2">{{ stat.label }}</p>
      </div>
    }
  </div>
</section>
