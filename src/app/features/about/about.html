<div class="bg-[#f5f5f5]">
  <app-about-breadcrumb />
  <div class="max-w-350 mx-auto px-5 md:px-8 py-10 md:py-14 space-y-12 md:space-y-16">
    <app-about-hero-banner />
    @if (stats().length > 0) {
      <app-about-stats-strip [stats]="stats()" />
    } @else {
      <app-about-stats-strip />
    }
    <app-about-company-story />
    <app-about-feature-cards />
    <app-about-mission-vision />
    <app-about-timeline />
    @if (team().length > 0) {
      <app-about-leadership [team]="team()" />
    } @else {
      <app-about-leadership />
    }
  </div>
  <app-about-promo-footer />
</div>
