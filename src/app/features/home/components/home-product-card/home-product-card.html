@let p = product();
<article
  class="group relative bg-white rounded-lg shadow-sm hover:shadow-lg transition overflow-hidden flex flex-col"
>
  @if (p.badge) {
    <span
      class="absolute top-2 left-2 z-10 text-[10px] font-bold uppercase px-2 py-1 rounded text-white"
      [class]="
        p.badge === 'new' ? 'bg-[#00B127]' : p.badge === 'hot' ? 'bg-red-500' : 'bg-orange-500'
      "
    >
      {{ p.badge }}
    </span>
  }

  <button
    class="absolute top-2 right-2 z-10 w-8 h-8 bg-white rounded-full shadow flex items-center justify-center opacity-0 group-hover:opacity-100 transition hover:text-red-500"
    aria-label="Add to favorites"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
      />
    </svg>
  </button>

  <div class="aspect-square overflow-hidden bg-gray-50">
    <img
      [src]="p.image"
      [alt]="p.name"
      loading="lazy"
      class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
    />
  </div>

  <div class="p-3 flex-1 flex flex-col">
    <p class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold">{{ p.brand }}</p>
    <h3 class="text-sm font-semibold text-[#1A1A1A] mt-1 line-clamp-2 min-h-10">{{ p.name }}</h3>

    <div class="flex items-baseline gap-2 mt-2">
      <span class="text-base font-bold text-[#00B127]">${{ p.price }}</span>
      @if (p.oldPrice) {
        <span class="text-xs text-gray-400 line-through">${{ p.oldPrice }}</span>
      }
    </div>

    @if (p.tag) {
      <span class="text-[10px] text-gray-600 mt-1 inline-flex items-center gap-1">
        <svg class="w-3 h-3 text-[#00B127]" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
          />
        </svg>
        {{ p.tag }}
      </span>
    }

    <button
      class="mt-3 w-full bg-[#1A1A1A] hover:bg-[#00B127] text-white text-xs font-semibold py-2 rounded transition opacity-0 group-hover:opacity-100"
    >
      Add to Cart
    </button>
  </div>
</article>
