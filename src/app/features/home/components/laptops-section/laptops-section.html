<section class="max-w-7xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-bold text-[#1A1A1A] uppercase tracking-wide">Laptops & Computers</h2>
    <a href="#" class="text-sm font-semibold text-[#00B127] hover:underline">View All →</a>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div
      class="lg:row-span-2 relative rounded-lg overflow-hidden bg-gradient-to-br from-slate-900 to-slate-700 text-white p-8 min-h-100 flex flex-col justify-end shadow-md"
    >
      <img
        src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600&auto=format&fit=crop"
        alt=""
        class="absolute inset-0 w-full h-full object-cover opacity-40"
      />
      <div class="relative z-10">
        <span class="text-xs uppercase font-bold tracking-wider text-[#00B127]">Featured</span>
        <h3 class="text-3xl font-bold mt-2 mb-3">Ultra-Slim Laptops</h3>
        <p class="text-sm opacity-90 mb-4">Power meets portability. Starting at $999.</p>
        <button
          class="bg-[#00B127] hover:bg-[#009621] font-semibold px-5 py-2 rounded-md text-sm transition"
        >
          Explore Collection
        </button>
      </div>
    </div>

    <div class="lg:col-span-2 grid grid-cols-2 gap-4">
      @for (p of laptops(); track p.id) {
        <app-home-product-card [product]="p" />
      }
    </div>
  </div>

  <div class="mt-4 bg-white rounded-lg shadow-sm p-4 flex flex-wrap items-center gap-3">
    <span class="text-sm font-semibold text-gray-700">Related:</span>
    @for (cat of categories; track cat) {
      <a
        href="#"
        class="text-sm px-3 py-1 bg-gray-100 hover:bg-[#00B127] hover:text-white text-gray-700 rounded-full transition"
        >{{ cat }}</a
      >
    }
  </div>
</section>
